name: Terraform

concurrency:
  group: terraform
  cancel-in-progress: false

# CS2: runs on the self-hosted runner cs2-mgmt01 (REQ-NCA-P2-11).
# No pull_request trigger: this repo is public, and code from a fork must never
# run on the on-prem runner (which holds the AWS credentials while a job runs).
on:
  push:
    branches: [main, cs2-hybrid]
    paths:
      - "terraform/**"
      - "soar/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The SOAR code ships inside the Terraform soar module, so its tests gate
  # every plan and apply: a failing test means nothing gets deployed.
  soar-tests:
    runs-on: [self-hosted, onprem]
    defaults:
      run:
        working-directory: soar
    steps:
      - uses: actions/checkout@v4

      - name: Install the test dependencies in a throwaway venv
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -r requirements-dev.txt

      - name: Run the SOAR unit tests
        run: '"$RUNNER_TEMP/venv/bin/python" -m pytest -q'

      - name: Remove the venv
        if: always()
        run: rm -rf "$RUNNER_TEMP/venv"

  terraform:
    needs: soar-tests
    runs-on: [self-hosted, onprem]
    defaults:
      run:
        working-directory: terraform
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      TF_VAR_admin_ssh_public_key: ${{ secrets.ADMIN_SSH_PUBLIC_KEY }}
      TF_VAR_db_admin_password: ${{ secrets.DB_ADMIN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # Apply requires a manual trigger rather than running automatically on
      # merge. AWS Academy's credentials are temporary and rotate between
      # lab sessions, so an apply queued to fire on merge could run with
      # expired credentials. Trigger it yourself from the Actions tab
      # ("Run workflow") right after refreshing the AWS_* secrets.
      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch'
        run: terraform apply -auto-approve tfplan

      # The plan file can hold sensitive values; never leave it on the runner.
      - name: Remove the plan file
        if: always()
        run: rm -f tfplan
